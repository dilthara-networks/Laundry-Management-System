<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Order</title>
    <link rel="stylesheet" th:href="@{/css/create_order.css}" />
    <script>
        function toggleAddress() {
            var deliveryType = document.getElementById("deliveryType").value;
            document.getElementById("addressField").style.display = (deliveryType === "delivery") ? "block" : "none";
        }
    </script>
</head>
<body>
<div class="container">
    <h1>Create Order</h1>
    <form th:action="@{/customer/create-order}" method="post">
        <div class="form-row">
            <label for="serviceId">Service:</label>
            <select id="serviceId" name="serviceId">
                <option th:each="service : ${services}" th:value="${service.id}" th:text="${service.name + ' - $' + service.price}"></option>
            </select>
        </div>

        <div class="form-row">
            <label for="deliveryType">Delivery Type:</label>
            <select id="deliveryType" name="deliveryType" onchange="toggleAddress()">
                <option value="delivery">Delivery</option>
                <option value="pickup">In-Store Pickup</option>
            </select>
        </div>

        <div class="form-row" id="addressField" style="display:none;">
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" />
        </div>

        <input type="submit" value="Place Order" />
    </form>
</div>
</body>
</html>
