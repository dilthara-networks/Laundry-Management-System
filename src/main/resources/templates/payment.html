<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment</title>
    <link rel="stylesheet" th:href="@{/css/payment.css}" />
</head>
<body>
<div class="container">
    <h1>Payment for Order <span class="order-id" th:text="${order.id}"></span></h1>
    <form id="paymentForm" th:action="@{/customer/pay}" method="post" novalidate>
        <input type="hidden" name="orderId" th:value="${order.id}" />

        <div class="form-row">
            <label for="cardNumber">Card Number:</label>
            <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required />
            <div class="error-message" id="cardNumberError">Please enter a valid 16-digit card number</div>
            <div class="card-icons">
                <div class="card-icon">💳</div>
                <div class="card-icon">VISA</div>
                <div class="card-icon">MC</div>
            </div>
        </div>

        <div class="form-row">
            <label for="expiry">Expiry Date:</label>
            <input type="text" id="expiry" name="expiry" placeholder="MM/YY" maxlength="5" required />
            <div class="error-message" id="expiryError">Please enter a valid expiry date (MM/YY)</div>
        </div>

        <div class="form-row">
            <label for="cvv">CVV:</label>
            <input type="text" id="cvv" name="cvv" placeholder="123" maxlength="4" required />
            <div class="error-message" id="cvvError">Please enter a valid CVV (3-4 digits)</div>
        </div>

        <input type="submit" id="submitBtn" value="Pay Now" />
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('paymentForm');
        const cardNumber = document.getElementById('cardNumber');
        const expiry = document.getElementById('expiry');
        const cvv = document.getElementById('cvv');
        const submitBtn = document.getElementById('submitBtn');

        // Format card number with spaces
        cardNumber.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
            let formattedValue = value.match(/.{1,4}/g)?.join(' ');
            e.target.value = formattedValue || value;
            validateCardNumber();
        });

        // Format expiry date
        expiry.addEventListener('input', function(e) {
            let value = e.target.value.replace(/[^0-9]/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2);
            }
            e.target.value = value.substring(0, 5);
            validateExpiry();
        });

        // Validate CVV
        cvv.addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
            validateCVV();
        });

        // Validation functions
        function validateCardNumber() {
            const value = cardNumber.value.replace(/\s+/g, '');
            const isValid = /^\d{16}$/.test(value);
            updateFieldValidation(cardNumber, isValid, 'cardNumberError');
            return isValid;
        }

        function validateExpiry() {
            const value = expiry.value;
            const regex = /^(0[1-9]|1[0-2])\/([0-9]{2})$/;
            const isValid = regex.test(value);
            updateFieldValidation(expiry, isValid, 'expiryError');
            return isValid;
        }

        function validateCVV() {
            const value = cvv.value;
            const isValid = /^\d{3,4}$/.test(value);
            updateFieldValidation(cvv, isValid, 'cvvError');
            return isValid;
        }

        function updateFieldValidation(field, isValid, errorId) {
            const errorElement = document.getElementById(errorId);
            if (isValid) {
                field.classList.remove('invalid');
                field.classList.add('valid');
                errorElement.classList.remove('show');
            } else {
                field.classList.remove('valid');
                field.classList.add('invalid');
                if (field.value) {
                    errorElement.classList.add('show');
                } else {
                    errorElement.classList.remove('show');
                }
            }
            updateSubmitButton();
        }

        function updateSubmitButton() {
            const isFormValid = validateCardNumber() && validateExpiry() && validateCVV();
            submitBtn.disabled = !isFormValid;
        }

        // Real-time validation
        cardNumber.addEventListener('blur', validateCardNumber);
        expiry.addEventListener('blur', validateExpiry);
        cvv.addEventListener('blur', validateCVV);

        // Form submission
        form.addEventListener('submit', function(e) {
            if (!validateCardNumber() || !validateExpiry() || !validateCVV()) {
                e.preventDefault();
                // Force show all errors on submit attempt
                validateCardNumber();
                validateExpiry();
                validateCVV();
                alert('Please fix the validation errors before submitting.');
            }
        });

        // Initial validation
        updateSubmitButton();
    });
</script>
</body>
</html>
