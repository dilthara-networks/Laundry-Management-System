spring.application.name=LaundryManagementSystem

# ── Database Configuration ──────────────────────────────────────────────────
# Update these values to match your local SQL Server setup
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=LaundrySystem;encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:your_password_here}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ── Thymeleaf ────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
